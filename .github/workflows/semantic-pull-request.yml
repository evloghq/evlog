name: Validate PR title

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  validate-pr:
    name: Validate PR title
    if: ${{ !contains(github.actor, 'renovate') }}

    # No checkout and no build, just API calls against the PR.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      error_message: ${{ steps.lint_pr_title.outputs.error_message }}
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        id: lint_pr_title
        with:
          scopes: |
            ai
            axiom
            bench
            better-auth
            better-stack
            clickhouse
            cli
            core
            datadog
            deps
            docs
            dx
            elysia
            evals
            eve
            evi
            express
            fastify
            fs
            hono
            hyperdx
            loki
            nestjs
            next
            nitro
            nuxt
            orpc
            otlp
            playground
            posthog
            react-router
            release
            repo
            sentry
            signals
            stream
            sveltekit
            tanstack-start
            telemetry
            vite
            workers
          types: |
            breaking
            feat
            fix
            build
            ci
            docs
            enhancement
            chore
            perf
            style
            test
            refactor
            revert
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  report:
    name: Report title errors
    needs: validate-pr
    if: ${{ always() && !contains(github.actor, 'renovate') }}

    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pull-requests: write # posts and clears the sticky comment
    steps:
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: needs.validate-pr.outputs.error_message != null
        with:
          header: pr-title-lint-error
          message: |
            Hey there and thank you for opening this pull request! 👋🏼

            We require pull request titles to follow the [Conventional Commits specification](https://www.conventionalcommits.org/en/v1.0.0/) and it looks like your proposed title needs to be adjusted.

            Details:

            ```
            ${{ needs.validate-pr.outputs.error_message }}
            ```

      - if: needs.validate-pr.outputs.error_message == null
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-title-lint-error
          message: |
            Thank you for following the naming conventions! 🙏
