name: ci

on:
  push:
    branches:
      - main
      - v3
  pull_request:
    branches:
      - main
      - v3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  # Fork PRs get no OIDC token, so they fall back to the local cache
  IS_INTERNAL: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
  TURBO_CACHE: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'remote:rw' || 'local:rw' }}
  # Without this, turbo silently treats every package as affected
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # remote cache OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # --affected needs history
          persist-credentials: false

      - parallel:
          - name: Set up Turborepo remote cache
            if: env.IS_INTERNAL == 'true'
            uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
            with:
              team: ${{ vars.TURBO_TEAM }}

          - name: Set up pnpm and Node
            uses: ./.github/actions/setup

      # apps/telemetry is left out of typecheck: its drizzle results resolve to
      # any on a cold CI checkout, so vue-tsc reports implicit-any on every
      # query callback. It never ran here before either. Tracked separately.
      - name: Lint
        run: pnpm exec turbo run lint --affected

      - name: Typecheck
        run: pnpm exec turbo run typecheck --affected --filter='!evlog-telemetry'

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 22 is the engines floor; 24 is the .node-version pin
        node-version: ['22', '24']
    permissions:
      contents: read
      id-token: write # remote cache OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - parallel:
          - name: Set up Turborepo remote cache
            if: env.IS_INTERNAL == 'true'
            uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
            with:
              team: ${{ vars.TURBO_TEAM }}

          - name: Set up pnpm and Node
            uses: ./.github/actions/setup
            with:
              node-version: ${{ matrix.node-version }}

      - name: Set up Bun for import regressions
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      # evlog and @evlog/cli run once below, under coverage, which enforces their thresholds.
      # The eve CLI refuses to start below Node 24, so the packages that build
      # with it only run on the 24 leg.
      - name: Test workspace
        run: pnpm exec turbo run test --affected --filter='!evlog' --filter='!@evlog/cli' ${{ matrix.node-version == '22' && '--filter=!@evlog/eve --filter=!evi --filter=!evlog-eve-example' || '' }}

      # content-lint lives in scripts/, outside the workspace graph, so turbo
      # never sees it. Its fixture test is what keeps the content pass honest.
      - name: Test content-lint
        run: pnpm run content:lint:test

      # Same reason: the release notes only run on a publish, too late to find out.
      - name: Test release-notes
        run: pnpm run release-notes:test

      # Same reason: the risk score runs from pull_request_target, off the default branch.
      - name: Test risk-score
        run: pnpm run risk-score:test

      # A ratchet, not a floor: every file this pull request touched has to score
      # at least as well as the same file on the base branch, and introduce no
      # finding id it did not already carry. A fixed bar would fail a new page
      # written at 85 while a page sitting at 60 since last year sails through.
      - name: Content did not regress
        if: github.event_name == 'pull_request'
        run: pnpm run content:lint -- --since origin/${{ github.base_ref }}

      # The coverage step bypasses turbo, so it inherits no dist/ from the
      # affected graph — on a docs-only change nothing is affected and the
      # dist-dependent tests (auto-import types, api-surface) would run
      # against a missing build. Prepare it explicitly; the remote cache
      # makes this a restore, not a rebuild, when src is untouched.
      # test/bin.test.ts runs the evlog bin, which needs the workspace
      # @evlog/cli built; without it the bin falls back to fetching the CLI.
      - name: Prepare evlog dist
        run: pnpm exec turbo run dev:prepare --filter=evlog --filter=@evlog/cli

      - name: Test evlog with coverage
        run: pnpm --filter evlog run test:coverage

      # test/build/size-budget.test.ts enforces the budget; this writes the table,
      # including when that test failed.
      - name: Bundle size report
        if: ${{ !cancelled() && matrix.node-version == '24' }}
        run: pnpm --filter evlog run size:budget >> "$GITHUB_STEP_SUMMARY"

      # The fs drain needs no network and no secret, so its round-trip e2e runs
      # on every pull request rather than only in e2e.yml.
      - name: Test fs drain end to end
        run: pnpm --filter evlog exec vitest run --config vitest.e2e.config.ts test/e2e/fs.e2e.ts

      - name: Test @evlog/cli with coverage
        run: pnpm --filter @evlog/cli run test:coverage

      # The sandbox smoke runs every non-interactive CLI command against a real
      # app per framework — the end-to-end seam (detect → init → doctor → map →
      # baseline) that unit tests cover only piecewise. Gated to changes that
      # can affect it, so a docs-only pull request skips the cost. Like the
      # coverage step it bypasses turbo, so it prepares the CLI and the
      # workspace packages it imports.
      - name: CLI sandbox smoke
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- packages/cli scripts/cli-sandbox.mjs | grep -q .; then
            pnpm exec turbo run dev:prepare --filter=@evlog/cli
            node scripts/cli-sandbox.mjs --smoke
          else
            echo "CLI untouched — smoke skipped"
          fi

      # A project already on evlog 2.x has to be able to add the CLI next to
      # it. npm resolves peers strictly here (no --legacy-peer-deps), so a peer
      # range that rejects 2.x fails the install with ERESOLVE. Checks the
      # lowest 2.x the CLI supports and the 2.33 line it is released against.
      - name: CLI installs next to evlog 2.x
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- packages/cli | grep -q .; then
            pnpm exec turbo run dev:prepare --filter=@evlog/cli
            pack_dir=$(mktemp -d)
            (cd packages/cli && pnpm pack --pack-destination "$pack_dir" >/dev/null)
            tarball=$(ls "$pack_dir"/*.tgz)
            for evlog in 2.31.0 2.33.1; do
              app=$(mktemp -d)
              (
                cd "$app"
                npm init -y >/dev/null
                npm install "evlog@$evlog"
                npm install --save-dev "$tarball"
                ./node_modules/.bin/evlog doctor --json >/dev/null
              )
            done
          else
            echo "CLI untouched, install check skipped"
          fi

  # The same smoke where the Test job cannot reach: the oldest Node the CLI
  # declares in `engines`, and Windows.
  #
  # `init` hands the skills install to `npx skills add`, which does not start on
  # Node 22.0 or 22.1, so that leg runs `init` with --no-agents.
  cli-compat:
    name: CLI smoke (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Node 22.0.0
            os: ubuntu-latest
            node: 22.0.0
            no-agents: '1'
          - name: Windows
            os: windows-latest
            node: ''
            no-agents: ''
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      id-token: write # remote cache OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whether the CLI changed
        id: cli
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- packages/cli scripts/cli-sandbox.mjs .github/workflows/ci.yml | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "CLI untouched — smoke skipped"
          fi

      - name: Set up Turborepo remote cache
        if: steps.cli.outputs.changed == 'true' && env.IS_INTERNAL == 'true'
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Set up pnpm and Node
        if: steps.cli.outputs.changed == 'true'
        uses: ./.github/actions/setup

      - name: Build the CLI
        if: steps.cli.outputs.changed == 'true'
        run: pnpm exec turbo run dev:prepare --filter=@evlog/cli

      # The build needs the workspace's Node; only the CLI under test runs on the old one.
      - name: Switch to Node ${{ matrix.node }}
        if: steps.cli.outputs.changed == 'true' && matrix.node != ''
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}

      - name: CLI sandbox smoke
        if: steps.cli.outputs.changed == 'true'
        env:
          EVLOG_SANDBOX_NO_AGENTS: ${{ matrix.no-agents }}
        run: |
          node --version
          node scripts/cli-sandbox.mjs --smoke

  examples:
    name: Build examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # remote cache OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - parallel:
          - name: Set up Turborepo remote cache
            if: env.IS_INTERNAL == 'true'
            uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
            with:
              team: ${{ vars.TURBO_TEAM }}

          - name: Set up pnpm and Node
            uses: ./.github/actions/setup

      # --continue: one broken example must not cancel the others
      - name: Build affected examples
        run: pnpm exec turbo run build --affected --continue --filter='./examples/*'

  # @evlog/eve peers `eve >=1.0.0` but develops against one pinned eve. This
  # runs it and examples/eve against the floor and against npm `latest`, so an
  # eve release that breaks them fails here (eve is exempt from
  # minimumReleaseAge, so `latest` is the release npm serves today). The latest
  # leg is allowed to fail: an upstream release must not block unrelated pull
  # requests, and the Renovate PR that bumps the pinned eve is where a break
  # becomes blocking.
  eve-compat:
    name: eve compatibility (${{ matrix.eve }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.eve == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        eve: ['1.0.0', 'latest']
    env:
      # The dependency graph differs from the lockfile, so nothing is shared with the remote cache
      TURBO_CACHE: local:rw
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node
        uses: ./.github/actions/setup

      - name: Install eve ${{ matrix.eve }}
        env:
          EVE: ${{ matrix.eve }}
        run: |
          (cd packages/eve && npm pkg set "devDependencies.eve=$EVE")
          (cd examples/eve && npm pkg set "dependencies.eve=$EVE")
          pnpm install --no-frozen-lockfile
          for dir in packages/eve examples/eve; do
            echo "$dir: eve $(node -p "require('./$dir/node_modules/eve/package.json').version")" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Build, typecheck and test
        run: pnpm exec turbo run build typecheck test --continue --filter=@evlog/eve --filter=evlog-eve-example

  # Report-only (no fail threshold in 3.0). Base and head run on this same
  # runner, so the comparison measures the change, not the machine. The job is
  # left out of the `ci` aggregate below on purpose: it can never block a merge.
  bench:
    name: Benchmarks (report only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base commit must be present for the worktree below
          persist-credentials: false

      - name: Set up pnpm and Node
        uses: ./.github/actions/setup

      - name: Record the runner
        run: |
          {
            echo "### Runner"
            echo ""
            echo "- Node $(node -v)"
            echo "- CPU: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs), $(nproc) vCPU"
            echo "- OS: $(uname -sr)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Benchmark the pull request head
        working-directory: packages/evlog
        run: |
          pnpm exec vitest bench bench/core/
          cp bench/results.json "$RUNNER_TEMP/head.json"

      # The base commit gets its own worktree. It reuses this checkout's
      # dependencies, which is accurate unless the pull request changed them.
      - name: Benchmark the base branch
        run: |
          git worktree add "$RUNNER_TEMP/base" "${{ github.event.pull_request.base.sha }}"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/base/node_modules"
          ln -s "$GITHUB_WORKSPACE/packages/evlog/node_modules" "$RUNNER_TEMP/base/packages/evlog/node_modules"
          cd "$RUNNER_TEMP/base/packages/evlog"
          pnpm exec vitest bench bench/core/
          cp bench/results.json "$RUNNER_TEMP/base.json"

      - name: Compare the benchmarks
        working-directory: packages/evlog
        run: |
          # compare.ts exits 1 past its threshold; in report-only mode that is output, not failure
          pnpm exec tsx bench/scripts/compare.ts --bench "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" >> "$GITHUB_STEP_SUMMARY" || true

      # One counting script for both sides, so a change in the count is a change
      # in the code under test and never in the measuring code.
      - name: Count records per request
        run: |
          cp packages/evlog/bench/scripts/event-count.ts "$RUNNER_TEMP/base/packages/evlog/bench/scripts/"
          {
            echo ""
            echo "### Records per request, base"
            echo ""
            cd "$RUNNER_TEMP/base/packages/evlog" && pnpm exec tsx bench/scripts/event-count.ts
            echo ""
            echo "### Records per request, head"
            echo ""
            cd "$GITHUB_WORKSPACE/packages/evlog" && pnpm exec tsx bench/scripts/event-count.ts
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish preview package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Not gated on the other jobs: a preview is most useful while the PR is red.
    # No preview for fork PRs: pkg.pr.new would serve the fork's code under the evlog name.
    if: >-
      (github.event_name != 'push' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v3')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      id-token: write # remote cache OIDC
      pull-requests: write # pkg-pr-new comments the preview install command
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - parallel:
          - name: Set up Turborepo remote cache
            if: env.IS_INTERNAL == 'true'
            uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
            with:
              team: ${{ vars.TURBO_TEAM }}

          - name: Set up pnpm and Node
            uses: ./.github/actions/setup

      - name: Build packages
        run: pnpm run build:package

      - name: Publish
        env:
          # renovate: datasource=npm depName=pkg-pr-new
          PKG_PR_NEW_VERSION: 0.0.93
        run: pnpx "pkg-pr-new@${PKG_PR_NEW_VERSION}" publish --compact --no-template --pnpm './packages/evlog' './packages/nuxthub' './packages/telemetry' './packages/cli' './packages/signals' './packages/eve'

  # Single required check, so branch protection survives job renames
  ci:
    name: ci
    runs-on: ubuntu-slim
    needs: [quality, test, cli-compat, examples, eve-compat]
    if: always()
    steps:
      # v3 publishes prereleases until 3.0 GA; drop this step on v3 when GA is cut
      - name: Keep v3 out of main
        if: github.head_ref == 'v3' && github.base_ref == 'main'
        run: |
          echo "::error::v3 is not merged into main before 3.0 GA"
          exit 1

      - name: Verify every required job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
