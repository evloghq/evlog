name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  release:
    # npm's trusted publisher only accepts this environment, which only main and v3 can deploy to
    environment: npm-publish
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # changesets/action pushes the release branch, so credentials stay
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org

      - name: Prepare
        run: pnpm dev:prepare

      - name: Build package
        run: pnpm build:package

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          title: "chore(repo): version packages"
          version: pnpm run version
          publish: pnpm run release
          # main requires signed commits. Through the API, GitHub signs the version commit it creates.
          commitMode: github-api
          # Releases are created here, then their bodies are rewritten below.
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # changesets sets `published` before it exits on a failed package, so these steps still
      # run for the packages that did reach npm. The job stays failed either way.
      # The action creates each released tag through the API as a lightweight ref, while changeset
      # publish made an annotated one under the same name; pushing that again is refused.
      - name: Push tags
        if: ${{ !cancelled() && steps.changesets.outputs.published == 'true' }}
        run: |
          for tag in $(git tag --points-at HEAD); do
            git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || git push origin "refs/tags/$tag"
          done

      # Rebuilds each release body from that package's PRs and changesets, then moves Latest
      # back to evlog. The header of scripts/release-notes/index.mjs says why.
      - name: Rewrite release notes and mark evlog Latest
        if: ${{ !cancelled() && steps.changesets.outputs.published == 'true' }}
        run: node scripts/release-notes/index.mjs '${{ steps.changesets.outputs.publishedPackages }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
