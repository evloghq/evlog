name: release

on:
  push:
    branches:
      - main
      - v3
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # changesets/action pushes the release branch, so credentials stay
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # Without pre.json, v3 would publish 3.0.0 to `latest`; with it, main would publish a prerelease
      - name: Check pre mode matches the branch
        run: |
          if [ "$GITHUB_REF_NAME" = v3 ] && [ ! -f .changeset/pre.json ]; then
            echo "::error::v3 publishes prereleases only, .changeset/pre.json is missing"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" = main ] && [ -f .changeset/pre.json ]; then
            echo "::error::main does not publish prereleases, .changeset/pre.json is present"
            exit 1
          fi

      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org

      - name: Prepare
        run: pnpm dev:prepare

      - name: Build package
        run: pnpm build:package

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          title: "chore(repo): version packages"
          version: pnpm run version
          publish: pnpm run release
          # Releases are created here, then their bodies are rewritten below.
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Push tags
        if: steps.changesets.outputs.published == 'true'
        run: git push --tags

      # Rebuilds each release body from that package's PRs and changesets, then moves Latest
      # back to evlog. The header of scripts/release-notes/index.mjs says why.
      - name: Rewrite release notes and mark evlog Latest
        if: steps.changesets.outputs.published == 'true'
        run: node scripts/release-notes/index.mjs '${{ steps.changesets.outputs.publishedPackages }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
