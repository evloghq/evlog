name: map preview

on:
  pull_request:
    branches: [feat/cli-api-and-formats]

permissions:
  contents: read
  security-events: write

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup
      - run: pnpm exec turbo run build --filter=@evlog/cli

      - name: Annotate the pull request
        run: node packages/cli/dist/cli.mjs map --format github --no-write --cwd packages/cli/test/map/fixtures/express-basic

      - name: Write the SARIF log
        run: node packages/cli/dist/cli.mjs map --format sarif --no-write --cwd packages/cli/test/map/fixtures/express-basic > evlog.sarif

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: evlog.sarif
          category: evlog-map
