name: Label PR

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
    branches:
      - main

# One run per PR at a time. A queued run replaces an older queued one, which is fine: each run reads the PR's current state.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  add-pr-labels:
    name: Add PR labels
    # The type label sorts the PR in the release notes, so it follows the title, not the first draft of it.
    if: github.event.action != 'edited' || github.event.changes.title.from != null
    # A few GitHub API calls, no checkout and no build: a 1 vCPU runner is plenty.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // The payload is a snapshot from when the event fired; a later title edit may already be applied.
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.payload.pull_request.number })
            const { number, title } = pr
            const current = pr.labels.map(l => l.name)

            // Conventional Commits type → label from .github/release.yml
            const typeLabels = {
              breaking: 'breaking',
              feat: 'feature',
              fix: 'bug',
              build: 'build',
              ci: 'ci',
              docs: 'documentation',
              enhancement: 'enhancement',
              perf: 'performance',
              style: 'style',
              test: 'test',
              refactor: 'refactor',
              revert: 'revert',
            }

            const match = title.match(/^(\w+)(?:\(([^)]*)\))?(!)?:/)
            const wanted = new Set()
            if (match) {
              const [, type, scope, bang] = match
              if (typeLabels[type]) wanted.add(typeLabels[type])
              // Only dependency bumps are release-worthy chores; the others go to Other Changes.
              if (type === 'chore' && scope === 'deps') wanted.add('dependencies')
              if (bang) wanted.add('breaking')
            }

            // `breaking` can be set by hand on a PR whose title has no `!`, so it is never removed.
            const managed = [...Object.values(typeLabels), 'dependencies'].filter(l => l !== 'breaking')
            const stale = current.filter(l => managed.includes(l) && !wanted.has(l))
            const missing = [...wanted].filter(l => !current.includes(l))

            const issue = { owner: context.repo.owner, repo: context.repo.repo, issue_number: number }
            for (const name of stale) await github.rest.issues.removeLabel({ ...issue, name })
            if (missing.length > 0) await github.rest.issues.addLabels({ ...issue, labels: missing })
