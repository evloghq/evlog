packages:
  - apps/*
  - packages/*
  - examples/*
  # Ignored by git as local scratch; keep it out of the lockfile too.
  - '!examples/repro'

shamefullyHoist: true
strictPeerDependencies: false

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false
  '@nestjs/core': false
  '@swc/core': false
  workerd: false
  better-sqlite3: true
  isolated-vm: true
  sharp: true
  maplibre-gl: false
  core-js: false

overrides:
  # A second @types/react copy makes React.Key incompatible with itself in
  # examples/eve; a second rolldown splits @nuxt/icon into two peer variants
  # that shamefullyHoist then refuses to hoist, breaking apps/playground.
  # A second vue copy leaves the Vercel bundle without vue/server-renderer,
  # so every request reaching the docs SSR function exits 1.
  vue: 3.5.42
  '@types/react': 19.2.18
  tsdown@0.22.8>rolldown: 1.2.7
  minimark: 0.2.0
  '@nuxtjs/mcp-toolkit': ^0.19.0
  # One `ai` copy for the whole tree. eve 0.12 needs 7 from the example
  # package, and docus 5.13 compiles against `isStepCount` which 6 does not
  # export. nuxt-studio still declares `ai@^6`; a second copy on Vercel
  # leaves the docs function with v6, so POST /__docus__/assistant crashes
  # at import (FUNCTION_INVOCATION_FAILED).
  ai: ^7.0.92
  # Nuxt 4.x requires @unhead/vue ^3.1.8 internally; some deps (e.g. @nuxt/ui)
  # declare a permissive `^2.0.5 || ^3.0.0` peer range that lets pnpm resolve
  # a stale v2, breaking Nuxt's `legacyPlugins` import at build time.
  '@unhead/vue': ^3.4.0

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  # Nuxt
  - '@nuxt/*'
  - '@nuxtjs/*'
  - 'nuxt'
  - 'nuxt-*'
  # Vercel
  - '@vercel/*'
  - '@ai-sdk/*'
  - 'ai'
  - '@github-tools/*'
  - 'eve'
  # Other
  - docus@5.13.0
  - '@databuddy/nuxt'
  - '@changesets/cli@2.31.1'
  - eve
  - satori@0.28.0
  - tsdown@0.22.8
  - "@rolldown/*"
  - "@workflow/*"
  - "@oxc-project/*"
  - experimental-ai-sdk-code-mode
  - nitro
  - rolldown
  - workflow
