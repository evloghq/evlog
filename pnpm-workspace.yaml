packages:
  - apps/*
  - packages/*
  - examples/*
  # Ignored by git as local scratch; keep it out of the lockfile too.
  - '!examples/repro'

shamefullyHoist: true
strictPeerDependencies: false

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false
  '@nestjs/core': false
  '@swc/core': false
  workerd: false
  better-sqlite3: true
  isolated-vm: true
  sharp: true
  maplibre-gl: false
  core-js: false

overrides:
  # A second @types/react copy makes React.Key incompatible with itself in
  # examples/eve; a second rolldown splits @nuxt/icon into two peer variants
  # that shamefullyHoist then refuses to hoist, breaking apps/playground.
  # A second vue copy leaves the Vercel bundle without vue/server-renderer,
  # so every request reaching the docs SSR function exits 1.
  vue: 3.5.45
  '@types/react': 19.3.0
  tsdown@0.22.8>rolldown: 1.3.0
  minimark: 0.2.0
  '@nuxtjs/mcp-toolkit': ^0.24.3
  # One `ai` copy for the whole tree. eve 0.12 needs 7 from the example
  # package, and docus 5.13 compiles against `isStepCount` which 6 does not
  # export.
  ai: ^7.0.165
  # Nuxt 4.x requires @unhead/vue ^3.1.8 internally; some deps (e.g. @nuxt/ui)
  # declare a permissive `^2.0.5 || ^3.0.0` peer range that lets pnpm resolve
  # a stale v2, breaking Nuxt's `legacyPlugins` import at build time.
  '@unhead/vue': ^3.4.3
  # Security fixes for transitive deps whose parents pin a vulnerable version
  # exactly. Each one stays within the pinned major; drop it once the parent
  # ships the fix.
  vinxi>h3: ^1.15.11
  eve>undici: ^8.12.3
  '@vercel/cli-config>zod': ^4.6.6
  '@agent-browser/eve>zod': ^4.6.6
  satori>fflate: ^0.7.5
  typed-rest-client>qs: ^6.16.1
  # Same purpose, but these cross the major (or 0.x minor) their dependents
  # declare: re-check them when those dependents are bumped.
  fontless>esbuild: ^0.28.1
  '@esbuild-kit/core-utils>esbuild': ^0.25.0
  '@sveltejs/kit@2': ^3.1.1
  katex@<0.18.2: ^0.18.2
  '@vercel/nft>glob': ^14.0.2
  '@nuxt/content>minimatch': ^11.0.1
  '@typescript-eslint/typescript-estree>minimatch': ^11.0.1
  readdir-glob>minimatch: ^11.0.1
  '@stryker-mutator/core>minimatch': ^11.0.1

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  # Nuxt
  - '@nuxt/*'
  - '@nuxtjs/*'
  - 'nuxt'
  # Named one by one: a `nuxt-*` wildcard would also exempt any new package anyone publishes with that prefix
  - nuxt-agent-discovery
  - nuxt-auth-utils
  - nuxt-charts
  - nuxt-component-meta
  - nuxt-define
  - nuxt-llms
  - nuxt-og-image
  - nuxt-schema-org
  - nuxt-site-config
  - nuxt-site-config-kit
  # Vercel
  - '@vercel/*'
  - '@ai-sdk/*'
  - 'ai'
  - '@agent-browser/*'
  - '@github-tools/*'
  - 'eve'
  # Other
  - '@databuddy/nuxt'
  - "@rolldown/*"
  - "@workflow/*"
  - "@oxc-project/*"
  - experimental-ai-sdk-code-mode
  - nitro
  - rolldown
  - workflow
  # Renovate security update: @sveltejs/kit@3.0.0
  - "@sveltejs/kit@3.0.0"
